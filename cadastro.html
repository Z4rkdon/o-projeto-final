<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Cadastro</title>
    <style>
        body {
            background-color: rgb(79, 228, 99);
        }
        h1 {
            color: rgb(122, 22, 216);
            text-align: center;
            font-family: cursive;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="#">
                    <img src="logo.png" height="100" alt="">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">PRODUTOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrinho.html">CARRINHO</a>
                        </li>
                        <li class="nav-item" id="nav-login">
                            <a class="nav-link" href="login.html">LOGIN</a>
                        </li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">
                            Opções
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="d-flex justify-content-center align-items-center my-5">
        <form id="form_cadastro" style="width: 100%; max-width: 500px; padding: 20px; background: white; border-radius: 8px;">
            <h1>Cadastro de Clientes</h1>
            
            <div class="mb-2">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" id="nome" placeholder="Guilherme, Richard, Pietro, Nycolas" required class="form-control">
            </div>

            <div class="mb-2">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" id="cpf" placeholder="444.444.444-44" required class="form-control">
            </div>

            <div class="mb-2">
                <label for="e-mail" class="form-label">E-mail:</label>
                <input type="email" id="e-mail" placeholder="@gmail.com" required class="form-control">
            </div>

            <div class="mb-2">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="text" id="telefone" placeholder="(99) 9999-9999" required class="form-control">
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha:</label>
                <input type="password" id="senha" placeholder="AS3nH@!$2023" required class="form-control">
            </div>

            <input type="submit" id="btn_enviar" value="Enviar Cadastro" class="btn btn-primary w-100">
        </form>
    </main>

    <footer></footer>

    <script>
        function pegar_dados() {
            const dados = {
                nome: document.getElementById("nome").value,
                cpf: document.getElementById("cpf").value,
                email: document.getElementById("e-mail").value,
                telefone: document.getElementById("telefone").value,
                senha: document.getElementById("senha").value
            }
            return dados;
        }

        const form = document.getElementById("form_cadastro");
        const btn_enviar = document.getElementById("btn_enviar");

        form.addEventListener("submit", async (event) => {
            event.preventDefault(); 
            btn_enviar.disabled = true;
            btn_enviar.value = "Enviando...";
            
            const dados = pegar_dados();

            try {
                const resposta = await fetch("http://10.216.243.227:3001/clientes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                });

                if (!resposta.ok) { 
                    throw new Error("Erro em cadastrar");
                }

                alert("Cliente cadastrado com sucesso!!!");
                window.location.href = "login.html";
            } catch(error) { 
                alert("Erro em cadastrar! " + error.message);
            } finally {
                btn_enviar.disabled = false;
                btn_enviar.value = "Enviar Cadastro";
            }
        });
    </script>

    <script src="./pages.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
